<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Thea Task Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --page:#f4f5f7; --surface:#ffffff; --ink:#14171c; --ink-2:#5b6270; --ink-3:#8a919e;
  --hair:#e1e4ea; --hair-2:#eef0f3; --weekend:rgba(20,23,28,0.045);
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-soft:rgba(42,120,214,0.10);
  --todo:#d3d8e0; --todo-ink:#14171c;
  --doing:#2a78d6; --doing-ink:#ffffff;
  --blocked:#fab219; --blocked-ink:#1a1400;
  --done:#a9dca9; --done-ink:#0b3d0b;
  --critical:#d03b3b; --good:#0a7a0a;
  --tip-bg:#14171c; --tip-ink:#f4f5f7;
  --focus:#2a78d6;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --labelw:600px; --colw:24px;
  --lgrid:14px 18px 180px 160px 92px 64px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --page:#101215; --surface:#181b20; --ink:#f1f2f4; --ink-2:#a9afba; --ink-3:#7d8492;
    --hair:#2a2f37; --hair-2:#20242b; --weekend:rgba(255,255,255,0.045);
    --accent:#3987e5; --accent-ink:#ffffff; --accent-soft:rgba(57,135,229,0.18);
    --todo:#4a515c; --todo-ink:#f1f2f4;
    --doing:#3987e5; --doing-ink:#ffffff;
    --blocked:#c98500; --blocked-ink:#1a1400;
    --done:#2f6e2f; --done-ink:#e6f5e6;
    --critical:#e66767; --good:#3cbf3c;
    --tip-bg:#f1f2f4; --tip-ink:#14171c;
    --focus:#3987e5;
  }
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none !important}
.app{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:14px}

/* auth */
.auth{max-width:380px;margin:12vh auto 0;padding-inline:16px;display:flex;flex-direction:column;gap:14px}
.auth h1{font-size:20px;font-weight:600;margin:0}
.auth p{margin:0;color:var(--ink-2);font-size:13px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card .field input{font-size:15px}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px;text-align:left}
.msg{font-size:13px;color:var(--ink-2);min-height:1em}
.msg.err{color:var(--critical)}

/* header */
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 24px}
.head h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-0.01em;text-wrap:balance}
.head .win{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.sum{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px;color:var(--ink-2)}
.sum span{white-space:nowrap}
.sum b{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--ink);margin-right:5px;font-variant-numeric:tabular-nums}
.sum .late b{color:var(--critical)}

/* toolbar */
.bar-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.btn{font-size:13px;padding:7px 12px;border-radius:6px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--critical);border-color:transparent;background:transparent}
.btn.danger.armed{background:var(--critical);color:#fff;border-color:var(--critical)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lbl{font-size:12px;color:var(--ink-3);margin-right:2px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--hair);background:var(--surface);color:var(--ink-2);cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.tgl input{margin:0}
.spacer{flex:1 1 auto}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.sync.live i{background:var(--good)}
.sync.saving i{background:var(--blocked)}
.sync.err i{background:var(--critical)}
.who{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px}
.banner{font-size:13px;padding:9px 12px;border-radius:6px;background:var(--accent-soft);color:var(--ink);border:1px solid var(--hair)}
.banner.warn{border-color:var(--critical)}

/* editor */
.editor{background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.ed-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ed-head strong{font-weight:600;font-size:14px}
.ed-head span{font-size:12px;color:var(--ink-3)}
.ed-grid{display:grid;grid-template-columns:2fr 2fr 1fr 1fr 1fr 1fr 1fr 1fr;gap:10px 12px}
.ed-hint{font-size:12px;color:var(--ink-3)}
.sel{font-size:12px;padding:3px 6px;border:1px solid var(--hair);border-radius:6px;background:var(--surface);color:var(--ink)}
.row.grp{border-top:1px solid var(--hair);background:var(--page)}
.row.grp .label{display:flex;background:var(--page);font-size:12px;font-weight:600;color:var(--ink);align-items:center;padding:6px 10px;gap:6px}
.row.grp .label .cnt{font-family:var(--mono);font-weight:400;color:var(--ink-3);margin-left:auto}
.row.grp .label .car{display:inline-block;width:0;height:0;border-left:5px solid var(--ink-3);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .12s}
.row.grp.open .label .car{transform:rotate(90deg)}
.row.grp .tl{min-height:0;height:30px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);min-width:0}
.field.wide{grid-column:1 / -1}
.field input,.field select{font-size:14px;padding:7px 9px;border:1px solid var(--hair);border-radius:6px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
.field input:disabled,.field select:disabled{opacity:.6}
.ed-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ed-err{font-size:13px;color:var(--critical);min-height:1em}
@media (max-width:760px){.ed-grid{grid-template-columns:1fr 1fr}.field.title{grid-column:1 / -1}}

/* board */
.board{background:var(--surface);border:1px solid var(--hair);border-radius:8px;overflow:auto;position:relative}
.row.hdr{position:sticky;top:0;z-index:4}
.row.hdr .label{z-index:5}
.row.hdr .tl{background-color:var(--surface)}
.row{display:flex;width:max-content;min-width:100%;border-top:1px solid var(--hair-2)}
.row.hdr{border-top:0}
.label{position:sticky;left:0;z-index:2;flex:0 0 var(--labelw);width:var(--labelw);background:var(--surface);border-right:1px solid var(--hair);padding:8px 10px;display:grid;grid-template-columns:var(--lgrid);column-gap:10px;align-items:center;cursor:pointer;min-width:0}
.label > span{position:relative}
.row.hdr .label > span{overflow:visible}
.drag{color:var(--ink-3);cursor:grab;user-select:none;font-size:14px;line-height:1;text-align:center;opacity:.55}
.drag:hover{opacity:1}
.row.dragging{opacity:.4}
.row.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.row.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.rz{position:absolute;top:-8px;bottom:-6px;right:-8px;width:12px;cursor:col-resize;z-index:3}
.rz::after{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:var(--hair)}
.rz:hover::after{background:var(--accent);width:2px}
.board[data-bp="m"] .typ,.board[data-bp="m"] .h-type,.board[data-bp="s"] .typ,.board[data-bp="s"] .h-type{display:none}
.board[data-bp="s"] .obj,.board[data-bp="s"] .h-obj{display:none}
.label:hover{background:var(--accent-soft)}
.label > span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.hdr .label{cursor:default;align-items:end;padding-bottom:6px;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3)}
.row.hdr .label:hover{background:var(--surface)}
.row.hdr .label .cnt{font-family:var(--mono);text-transform:none;letter-spacing:0;color:var(--ink-3);text-align:right}
.chk{margin:0;accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
.ttl{font-size:13.5px;font-weight:500;color:var(--ink)}
.is-done .ttl{text-decoration:line-through;color:var(--ink-3);font-weight:400}
.obj{font-size:12.5px;color:var(--ink-2)}
.own{font-size:12.5px;font-weight:500;color:var(--ink)}
.typ{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--ink-2);justify-self:start;max-width:100%}
.is-done .obj,.is-done .own{color:var(--ink-3)}
.typ:empty{background:transparent;padding:0}
.pill{font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid;letter-spacing:.02em;line-height:1.5;white-space:nowrap}
.pill.s-todo{border-color:var(--ink-3);color:var(--ink-2)}
.pill.s-doing{border-color:var(--doing);color:var(--doing)}
.pill.s-blocked{border-color:var(--blocked);color:var(--blocked-ink);background:var(--blocked)}
.pill.s-done{border-color:var(--good);color:var(--good)}

.tl{position:relative;flex:0 0 auto;width:calc(var(--colw) * var(--days, 98));min-height:46px;align-self:stretch}
.row.hdr .tl{height:50px;border-bottom:1px solid var(--hair)}
.mo{position:absolute;top:0;height:16px;line-height:16px;padding-left:5px;font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--ink);border-left:1px solid var(--hair);white-space:nowrap;overflow:hidden}
.wd,.dy{position:absolute;text-align:center;font-family:var(--mono);color:var(--ink-3);white-space:nowrap;overflow:hidden}
.wd{top:17px;height:16px;line-height:16px;font-size:9px;letter-spacing:-.02em}
.dy{top:33px;height:16px;line-height:16px;font-size:10px;color:var(--ink-2)}
.wd.m,.dy.m{border-left:1px solid var(--hair-2)}
.wd.we,.dy.we{color:var(--hair)}
.dy.now{color:var(--accent);font-weight:600}
.dy.now::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:4px;height:3px;border-radius:2px 2px 0 0;background:var(--accent)}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.85;pointer-events:none;z-index:1}
.row.hdr .today{top:50px}
.bar{position:absolute;top:50%;transform:translateY(-50%);height:24px;line-height:24px;border-radius:4px;font-size:12px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;z-index:1}
.bar.s-todo{background:var(--todo);color:var(--todo-ink)}
.bar.s-doing{background:var(--doing);color:var(--doing-ink)}
.bar.s-blocked{background:var(--blocked);color:var(--blocked-ink);background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.14) 0 4px,transparent 4px 9px)}
.bar.s-done{background:var(--done);color:var(--done-ink)}
.bar.overdue{box-shadow:inset 0 0 0 2px var(--critical)}
.bar.occ{padding:0;text-align:center;min-width:6px}
.bar.occ.past{opacity:.45}
.bar.clip-l{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.clip-r{border-top-right-radius:0;border-bottom-right-radius:0}
.bar:hover{filter:brightness(1.06)}
.edge{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;cursor:pointer}
.edge.l{left:6px}.edge.r{right:6px}
.empty{padding:32px 16px;color:var(--ink-2);font-size:14px;position:sticky;left:0}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:11px;border-radius:3px;display:inline-block}
.sw.s-todo{background:var(--todo)}.sw.s-doing{background:var(--doing)}
.sw.s-blocked{background:var(--blocked);background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.14) 0 3px,transparent 3px 6px)}
.sw.s-done{background:var(--done)}.sw.overdue{background:transparent;box-shadow:inset 0 0 0 2px var(--critical)}
.sw.now-line{width:2px;height:14px;background:var(--accent);border-radius:0}

.tip{position:fixed;z-index:20;background:var(--tip-bg);color:var(--tip-ink);font-size:12px;line-height:1.45;padding:8px 10px;border-radius:6px;pointer-events:none;max-width:280px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tip b{font-weight:600}
.tip .mono{font-family:var(--mono);opacity:.85}

@media (max-width:560px){
  .ttl{font-size:13px}
  .head h1{font-size:18px}
}
@media (prefers-reduced-motion: no-preference){
  .btn,.chip{transition:background-color .12s,border-color .12s}
}
</style>
</head>
<body>

<!-- Sign in -->
<div class="auth" id="auth" hidden>
  <h1>Thea Task Board</h1>
  <p>Sign in with the email you were invited with.</p>
  <form class="card" id="login-form">
    <label class="field">Email<input type="email" id="l-email" autocomplete="username" required></label>
    <label class="field">Password<input type="password" id="l-pass" autocomplete="current-password" required></label>
    <button class="btn primary" id="b-login" type="submit">Sign in</button>
    <button class="link" id="b-forgot" type="button">Forgot password? Email me a reset link</button>
    <div class="msg" id="l-msg"></div>
  </form>
  <p id="setup-msg" hidden></p>
</div>

<!-- Set / change password -->
<div class="auth" id="pw" hidden>
  <h1>Set your password</h1>
  <p>Choose a password for this board. At least 10 characters.</p>
  <form class="card" id="pw-form">
    <label class="field">New password<input type="password" id="p-new" autocomplete="new-password" minlength="10" required></label>
    <label class="field">Repeat it<input type="password" id="p-rep" autocomplete="new-password" minlength="10" required></label>
    <button class="btn primary" type="submit">Save password</button>
    <button class="btn quiet" id="b-pw-cancel" type="button">Cancel</button>
    <div class="msg" id="p-msg"></div>
  </form>
</div>

<!-- Board -->
<div class="app" id="app" hidden>
  <div class="head">
    <h1>Thea Task Board</h1>
    <span class="win" id="win"></span>
  </div>
  <div class="sum" id="sum"></div>

  <div id="banner" class="banner" hidden></div>

  <div class="bar-row">
    <button class="btn primary" id="b-add">+ Add task</button>
    <div class="chips" id="types-chips"></div>
    <div class="chips" id="owners-chips"></div>
    <label class="tgl">Group by <select id="group-by" class="sel"><option value="">None</option><option value="type">Type</option><option value="owner">Owner</option></select></label>
    <label class="tgl"><input type="checkbox" id="hide-done"> Hide done</label>
    <span class="spacer"></span>
    <span class="sync" id="sync"><i></i><span>Connecting</span></span>
    <span class="who" id="who"></span>
    <button class="btn quiet" id="b-pwchange" title="Change password">Password</button>
    <button class="btn quiet" id="b-logout">Sign out</button>
  </div>

  <section class="editor" id="editor" hidden>
    <div class="ed-head"><strong id="ed-label">New task</strong><span id="ed-sub"></span></div>
    <div class="ed-grid">
      <label class="field title">Task<input id="f-title" maxlength="140" autocomplete="off"></label>
      <label class="field title">Objective<input id="f-objective" maxlength="200" autocomplete="off"></label>
      <label class="field">Type<input id="f-type" list="types-list" maxlength="40" autocomplete="off"></label>
      <label class="field">Owner<input id="f-owner" list="owners" maxlength="40" autocomplete="off"></label>
      <label class="field">Status<select id="f-status">
        <option value="todo">To do</option>
        <option value="doing">In progress</option>
        <option value="blocked">Blocked</option>
        <option value="done">Done</option>
      </select></label>
      <label class="field">Start<input type="date" id="f-start"></label>
      <label class="field">Due<input type="date" id="f-due"></label>
      <label class="field">Repeat<select id="f-repeat">
        <option value="">No</option>
        <option value="weekly">Every week</option>
        <option value="biweekly">Every 2 weeks</option>
        <option value="monthly">Every month</option>
      </select></label>
      <label class="field wide">Notes<input id="f-notes" maxlength="300" autocomplete="off"></label>
    </div>
    <div class="ed-hint" id="ed-hint" hidden></div>
    <datalist id="owners"></datalist>
    <datalist id="types-list"></datalist>
    <div class="ed-actions">
      <button class="btn primary" id="b-save">Save</button>
      <button class="btn" id="b-cancel">Cancel</button>
      <button class="btn quiet" id="b-up" title="Move up in the list">▲ Up</button>
      <button class="btn quiet" id="b-down" title="Move down in the list">▼ Down</button>
      <span class="spacer"></span>
      <button class="btn danger" id="b-del">Delete</button>
    </div>
    <div class="ed-err" id="ed-err"></div>
  </section>

  <div class="board" id="board"></div>

  <div class="legend">
    <span><i class="sw s-todo"></i>To do</span>
    <span><i class="sw s-doing"></i>In progress</span>
    <span><i class="sw s-blocked"></i>Blocked</span>
    <span><i class="sw s-done"></i>Done</span>
    <span><i class="sw overdue"></i>Overdue</span>
    <span><i class="sw now-line"></i>Today</span>
  </div>
</div>
<div class="tip" id="tip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
'use strict';
const BACK = 7, FWD = 13 * 7, DAYS = BACK + FWD;
const STATUS = {todo:'To do', doing:'In progress', blocked:'Blocked', done:'Done'};
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];
const $ = s => document.querySelector(s);

// ---- dates (local calendar days, ISO strings) ----
const pad = n => String(n).padStart(2,'0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => fmt(new Date());
function parse(s){ if(!s||typeof s!=='string') return null; const [y,m,d]=s.slice(0,10).split('-').map(Number); if(!y||!m||!d) return null; return new Date(y,m-1,d); }
function addDays(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return fmt(d); }
function diff(a,b){ const A=parse(a),B=parse(b); return Math.round((Date.UTC(B.getFullYear(),B.getMonth(),B.getDate())-Date.UTC(A.getFullYear(),A.getMonth(),A.getDate()))/86400000); }
const short = s => { const d=parse(s); return d ? `${d.getDate()} ${MON[d.getMonth()]}` : ''; };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---- state ----
let today = todayStr();
let winStart = addDays(today, -BACK);
let tasks = [];
let sb = null, session = null, loaded = false, live = false;
let editingId = null, isNew = false;
const CFG_COLS = Object.assign({task:180, objective:160, type:92, owner:64}, (window.TTB_CONFIG && window.TTB_CONFIG.columns) || {});
let ui = { hideDone:false, owner:'', type:'', groupBy:'', collapsed:[], lastOwner:'', cols:{...CFG_COLS} };
try {
  ui.hideDone = localStorage.getItem('ttb.hideDone') === '1'; ui.owner = localStorage.getItem('ttb.owner') || '';
  ui.type = localStorage.getItem('ttb.type') || ''; ui.groupBy = localStorage.getItem('ttb.groupBy') || '';
  ui.collapsed = JSON.parse(localStorage.getItem('ttb.collapsed') || '[]'); ui.lastOwner = localStorage.getItem('ttb.lastOwner') || '';
  ui.cols = Object.assign({}, CFG_COLS, JSON.parse(localStorage.getItem('ttb.cols') || '{}'));
} catch(e){}
$('#hide-done').checked = ui.hideDone;
$('#group-by').value = ui.groupBy;
const TYPES = (window.TTB_CONFIG && Array.isArray(window.TTB_CONFIG.types)) ? window.TTB_CONFIG.types.map(String) : [];
function remember(k, v){ try { localStorage.setItem('ttb.' + k, typeof v === 'string' ? v : JSON.stringify(v)); } catch(_){} }

// ---- helpers ----
function fromRow(r){
  return { id:r.id, position:(typeof r.position === 'number' ? r.position : null), title:r.title, objective:r.objective || '', repeat:r.repeat || '', type:r.type || '', owner:r.owner || '', status:r.status, start:r.start_date, due:r.due_date, notes:r.notes || '', updatedAt:r.updated_at, updatedBy:r.updated_by || '' };
}
function norm(t){
  const s = STATUS[t.status] ? t.status : 'todo';
  const start = parse(t.start) ? t.start.slice(0,10) : (parse(t.due) ? t.due.slice(0,10) : today);
  const due = parse(t.due) && t.due.slice(0,10) >= start ? t.due.slice(0,10) : start;
  const repeat = ['weekly','biweekly','monthly'].includes(t.repeat) ? t.repeat : '';
  const out = {...t, status:s, start, due, repeat, title:t.title || '(untitled)', objective:t.objective || '', type:t.type || '', owner:t.owner || '', notes:t.notes || ''};
  if(repeat){ out.occ = occurrences(start, due, repeat); out.next = out.occ.find(d => d >= today) || null; }
  return out;
}
const REPEAT = {weekly:'Every week', biweekly:'Every 2 weeks', monthly:'Every month'};
const DOWL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function occurrences(start, end, repeat){
  // dates from start to end (inclusive) on the pattern; capped at 400 entries
  const out = []; const s0 = parse(start); if(!s0) return out;
  if(repeat === 'monthly'){
    const dom = s0.getDate();
    for(let k = 0; k < 400; k++){
      const d = new Date(s0.getFullYear(), s0.getMonth() + k, dom);
      if(d.getDate() !== dom) continue;            // month too short (e.g. 31st): skip
      const iso = fmt(d); if(iso > end) break; out.push(iso);
    }
  } else {
    const step = repeat === 'biweekly' ? 14 : 7;
    for(let k = 0; k < 400; k++){ const iso = addDays(start, k * step); if(iso > end) break; out.push(iso); }
  }
  return out;
}
function repeatText(t){
  if(!t.repeat) return '';
  const dow = DOWL[parse(t.start).getDay()];
  return t.repeat === 'monthly' ? `Every month on the ${parse(t.start).getDate()}` : `${REPEAT[t.repeat]} on ${dow}s`;
}
function setSync(state, text){
  const el = $('#sync');
  const cls = state || (live ? 'live' : '');
  el.className = 'sync ' + cls;
  const labels = {live:'Live', saving:'Saving…', err:'Connection problem', '':'Connecting'};
  el.querySelector('span').textContent = text || labels[cls] || '';
}
function showBanner(msg, warn){ const b=$('#banner'); b.textContent=msg||''; b.className='banner'+(warn?' warn':''); b.hidden=!msg; }
function show(which){ ['auth','pw','app'].forEach(id => $('#'+id).hidden = id !== which); }

// ---- render ----
function render(){
  const all = tasks.map(norm);
  renderSummary(all);
  renderFilters(all);
  renderBoard(all);
}

function renderSummary(all){
  $('#win').textContent = `${short(winStart)} – ${short(addDays(winStart, DAYS-1))}`;
  const open = all.filter(t=>t.status!=='done');
  const doing = open.filter(t=>t.status==='doing').length;
  const blocked = open.filter(t=>t.status==='blocked').length;
  const overdue = open.filter(t=>t.due < today).length;
  const weekEnd = addDays(today,6);
  const dueWeek = open.filter(t=>{ const d = t.repeat ? t.next : t.due; return d && d >= today && d <= weekEnd; }).length;
  $('#sum').innerHTML =
    `<span><b>${open.length}</b>open</span>` +
    `<span><b>${doing}</b>in progress</span>` +
    `<span><b>${blocked}</b>blocked</span>` +
    `<span class="${overdue?'late':''}"><b>${overdue}</b>overdue</span>` +
    `<span><b>${dueWeek}</b>due in the next 7 days</span>`;
}

function renderFilters(all){
  const owners = [...new Set(all.map(t=>t.owner).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  if(ui.owner && !owners.includes(ui.owner)) ui.owner = '';
  const c = $('#owners-chips');
  c.innerHTML = owners.length
    ? `<span class="lbl">Owner</span><button class="chip${ui.owner?'':' on'}" data-owner="">All</button>` +
      owners.map(o=>`<button class="chip${ui.owner===o?' on':''}" data-owner="${esc(o)}">${esc(o)}</button>`).join('')
    : '';
  $('#owners').innerHTML = owners.map(o=>`<option value="${esc(o)}"></option>`).join('');
  const used = new Set(all.map(t=>t.type).filter(Boolean));
  const types = TYPES.filter(t => used.has(t)).concat([...used].filter(t => !TYPES.includes(t)).sort());
  const known = TYPES.concat([...used].filter(t => !TYPES.includes(t)).sort());
  $('#types-list').innerHTML = known.map(t=>`<option value="${esc(t)}"></option>`).join('');
  if(ui.type && !types.includes(ui.type)) ui.type = '';
  const tc = $('#types-chips');
  tc.innerHTML = types.length
    ? `<span class="lbl">Type</span><button class="chip${ui.type?'':' on'}" data-type="">All</button>` +
      types.map(t=>`<button class="chip${ui.type===t?' on':''}" data-type="${esc(t)}">${esc(t)}</button>`).join('')
    : '';
}

function layoutCols(){
  const board = $('#board');
  const bp = window.innerWidth < 560 ? 's' : window.innerWidth < 900 ? 'm' : 'l';
  board.dataset.bp = bp;
  const c = ui.cols;
  const tracks = [14, 18, c.task].concat(bp === 's' ? [] : [c.objective]).concat(bp === 'l' ? [c.type] : []).concat([c.owner]);
  board.style.setProperty('--lgrid', tracks.map(w => w + 'px').join(' '));
  const labelW = tracks.reduce((a, b) => a + b, 0) + (tracks.length - 1) * 10 + 20;
  board.style.setProperty('--labelw', labelW + 'px');
  return labelW;
}

function renderBoard(all){
  const board = $('#board');
  const labelW = layoutCols();
  board.style.maxHeight = Math.max(260, window.innerHeight - board.getBoundingClientRect().top - 16) + 'px';
  const avail = board.clientWidth - labelW - 2;
  const colW = Math.max(18, Math.floor(avail / DAYS));
  board.style.setProperty('--colw', colW+'px');
  board.style.setProperty('--labelw', labelW+'px');
  board.style.setProperty('--days', String(DAYS));
  const tlW = colW * DAYS;
  const tIdx = diff(winStart, today);

  const days = Array.from({length:DAYS}, (_,i)=>addDays(winStart,i));
  const stops = [];
  days.forEach((d,i)=>{ const dow=parse(d).getDay(); if(dow===0||dow===6) stops.push(`transparent ${i*colW}px, var(--weekend) ${i*colW}px, var(--weekend) ${(i+1)*colW}px, transparent ${(i+1)*colW}px`); });
  const bg = `linear-gradient(to right, ${stops.join(', ')}), repeating-linear-gradient(to right, var(--hair-2) 0 1px, transparent 1px ${colW}px)`;
  const todayLine = `<div class="today" style="left:${tIdx*colW + colW/2 - 1}px"></div>`;

  let visible = all.filter(t => (!ui.hideDone || t.status!=='done') && (!ui.owner || t.owner===ui.owner) && (!ui.type || t.type===ui.type));
  const byDate = (a,b)=>{
    const ad = a.status==='done', bd = b.status==='done';
    if(ad!==bd) return ad ? 1 : -1;
    if(ad) return b.due.localeCompare(a.due);
    return a.start.localeCompare(b.start) || a.due.localeCompare(b.due) || a.title.localeCompare(b.title);
  };
  const byPos = (a,b)=>{
    const ad = a.status==='done', bd = b.status==='done';
    if(ad!==bd) return ad ? 1 : -1;
    const ap = a.position, bp2 = b.position;
    if(ap != null && bp2 != null && ap !== bp2) return ap - bp2;
    if(ap != null && bp2 == null) return -1;
    if(ap == null && bp2 != null) return 1;
    return byDate(a,b);
  };
  visible.sort(byPos);
  // grouping: list of {key, label, tasks}; a single unnamed group when not grouping
  const gb = ui.groupBy;
  let groups;
  if(gb === 'type' || gb === 'owner'){
    const keyOf = t => t[gb] || '';
    const order = gb === 'type' ? TYPES : [...new Set(visible.map(keyOf).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    const keys = order.filter(k => visible.some(t => keyOf(t)===k)).concat([...new Set(visible.map(keyOf))].filter(k => k && !order.includes(k)).sort());
    if(visible.some(t => !keyOf(t))) keys.push('');
    groups = keys.map(k => ({ key:k, label: k || (gb==='type' ? 'No type' : 'No owner'), tasks: visible.filter(t => keyOf(t)===k) }));
  } else groups = [{ key:null, label:'', tasks:visible }];

  let h = `<div class="row hdr"><div class="label"><span></span><span></span><span>Task<i class="rz" data-col="task"></i></span><span class="h-obj">Objective<i class="rz" data-col="objective"></i></span><span class="h-type">Type<i class="rz" data-col="type"></i></span><span>Owner<i class="rz" data-col="owner"></i></span></div>` +
          `<div class="tl" style="width:${tlW}px;background-image:${bg}">`;
  let i = 0;
  while(i < DAYS){
    const m = parse(days[i]).getMonth();
    let j = i+1; while(j < DAYS && parse(days[j]).getMonth() === m) j++;
    const w = (j-i)*colW;
    h += `<div class="mo" style="left:${i*colW}px;width:${w}px">${w >= 30 ? MON[m] : ''}</div>`;
    i = j;
  }
  days.forEach((d,k)=>{
    const dt = parse(d), dow = dt.getDay(), we = dow===0 || dow===6, mon = dow===1;
    const cls = `${we?' we':''}${mon?' m':''}`;
    h += `<div class="wd${cls}" style="left:${k*colW}px;width:${colW}px">${DOW[dow]}</div>` +
         `<div class="dy${cls}${d===today?' now':''}" style="left:${k*colW}px;width:${colW}px">${dt.getDate()}</div>`;
  });
  h += `${todayLine}</div></div>`;

  if(!loaded){
    h += `<div class="empty">Loading tasks…</div>`;
  } else if(!visible.length){
    h += `<div class="empty">${all.length ? 'Nothing matches the current filter.' : 'No tasks yet. Add the first one.'}</div>`;
  }
  for(const g of groups){
  let collapsed = false;
  if(g.key !== null){
    const gid = gb + ':' + g.key;
    collapsed = ui.collapsed.includes(gid);
    const open = g.tasks.filter(t => t.status !== 'done').length;
    h += `<div class="row grp${collapsed?'':' open'}" data-gid="${esc(gid)}"><div class="label"><span class="car"></span>${esc(g.label)}<span class="cnt">${open} open · ${g.tasks.length} total</span></div>` +
         `<div class="tl" style="width:${tlW}px;background-image:${bg}">${todayLine}</div></div>`;
    if(collapsed) continue;
  }
  for(const t of g.tasks){
    const done = t.status==='done';
    const overdue = !done && t.due < today;
    const si = diff(winStart, t.start), ei = diff(winStart, t.due);
    let barHtml = '';
    if(t.repeat){
      const inWin = t.occ.filter(d => d >= winStart && d <= days[DAYS-1]);
      if(!inWin.length){
        barHtml = ei < 0 ? `<span class="edge l" data-id="${esc(t.id)}">← ended ${short(t.due)}</span>`
                : si >= DAYS ? `<span class="edge r" data-id="${esc(t.id)}">starts ${short(t.start)} →</span>` : '';
      } else {
        barHtml = inWin.map(d => { const k = diff(winStart, d); return `<div class="bar occ s-${t.status}${d < today ? ' past' : ''}${overdue?' overdue':''}" style="left:${k*colW+1}px;width:${colW-2}px" data-id="${esc(t.id)}"></div>`; }).join('');
      }
    } else if(ei < 0){
      barHtml = `<span class="edge l" data-id="${esc(t.id)}">← ended ${short(t.due)}</span>`;
    } else if(si >= DAYS){
      barHtml = `<span class="edge r" data-id="${esc(t.id)}">starts ${short(t.start)} →</span>`;
    } else {
      const cs = Math.max(si,0), ce = Math.min(ei, DAYS-1);
      const clipL = si < 0, clipR = ei > DAYS-1;
      const left = cs*colW + 1, width = (ce-cs+1)*colW - 2;
      const label = width >= 70 ? esc((clipL?'← ':'') + t.title + (clipR?' →':'')) : '';
      barHtml = `<div class="bar s-${t.status}${clipL?' clip-l':''}${clipR?' clip-r':''}${overdue?' overdue':''}" style="left:${left}px;width:${width}px" data-id="${esc(t.id)}">${label}</div>`;
    }
    h += `<div class="row${done?' is-done':''}" data-id="${esc(t.id)}">` +
      `<div class="label"><span class="drag" draggable="true" title="Drag to reorder">⋮⋮</span><input type="checkbox" class="chk" ${done?'checked':''} aria-label="Mark done: ${esc(t.title)}">` +
      `<span class="ttl" title="${esc(t.title)}">${esc(t.title)}</span>` +
      `<span class="obj" title="${esc(t.objective)}">${esc(t.objective)}</span>` +
      `<span class="typ">${esc(t.type)}</span>` +
      `<span class="own" title="${esc(t.owner)}">${esc(t.owner)}</span></div>` +
      `<div class="tl" style="width:${tlW}px;background-image:${bg}">${todayLine}${barHtml}</div></div>`;
  }
  }
  board.innerHTML = h;
}

// ---- editor ----
const ed = $('#editor');
const F = { title:$('#f-title'), objective:$('#f-objective'), type:$('#f-type'), owner:$('#f-owner'), status:$('#f-status'), start:$('#f-start'), due:$('#f-due'), repeat:$('#f-repeat'), notes:$('#f-notes') };
function updateHint(){
  const r = F.repeat.value, h = $('#ed-hint');
  if(!r || !parse(F.start.value)){ h.hidden = true; return; }
  const t = { repeat:r, start:F.start.value };
  const occ = occurrences(F.start.value, parse(F.due.value) ? F.due.value : F.start.value, r);
  h.textContent = `${repeatText(t)}, from ${short(F.start.value)} until ${short(F.due.value || F.start.value)}: ${occ.length} occurrence${occ.length===1?'':'s'}. Start = first one, Due = last one.`;
  h.hidden = false;
}
['change','input'].forEach(ev => { F.repeat.addEventListener(ev, updateHint); F.start.addEventListener(ev, updateHint); F.due.addEventListener(ev, updateHint); });
function openEditor(id){
  const t = id ? tasks.map(norm).find(x=>x.id===id) : null;
  editingId = t ? t.id : null; isNew = !t;
  $('#ed-label').textContent = t ? 'Edit task' : 'New task';
  $('#ed-sub').textContent = t && t.updatedAt ? `last saved ${new Date(t.updatedAt).toLocaleString()}${t.updatedBy ? ' by ' + t.updatedBy : ''}` : '';
  F.title.value = t ? t.title : '';
  F.objective.value = t ? t.objective : '';
  F.type.value = t ? t.type : (ui.type || '');
  F.owner.value = t ? t.owner : (ui.owner || ui.lastOwner || '');
  F.status.value = t ? t.status : 'todo';
  F.start.value = t ? t.start : today;
  F.due.value = t ? t.due : addDays(today, 7);
  F.repeat.value = t ? t.repeat : '';
  F.notes.value = t ? t.notes : '';
  updateHint();
  $('#b-del').hidden = isNew; $('#b-up').hidden = isNew; $('#b-down').hidden = isNew;
  $('#b-del').classList.remove('armed'); $('#b-del').textContent = 'Delete';
  $('#ed-err').textContent = '';
  ed.hidden = false;
  ed.scrollIntoView({block:'nearest'});
  F.title.focus();
}
function closeEditor(){ ed.hidden = true; editingId = null; }

async function writeTask(fn){
  setSync('saving');
  try { await fn(); return true; }
  catch(e){ handleWriteError(e); return false; }
  finally { setSync(); }
}
function handleWriteError(e){
  console.error('write failed', e);
  const m = (e && e.message) ? e.message : '';
  if(/row-level security|permission|JWT|not authorized/i.test(m)) $('#ed-err').textContent = 'Not allowed. Your login may have expired: sign out and back in.';
  else $('#ed-err').textContent = 'Could not save. ' + (m ? m : 'Check your connection and try again.');
}
function must(res){ if(res.error) throw res.error; return res.data; }
function meLabel(){ return session && session.user ? (session.user.email || '') : ''; }

async function saveTask(){
  const title = F.title.value.trim();
  if(!title){ $('#ed-err').textContent = 'Give the task a title.'; F.title.focus(); return; }
  const start = parse(F.start.value) ? F.start.value : today;
  let due = parse(F.due.value) ? F.due.value : start;
  if(due < start) due = start;
  const owner = F.owner.value.trim();
  const row = { title, objective:F.objective.value.trim(), repeat:F.repeat.value, type:F.type.value.trim(), owner, status:F.status.value, start_date:start, due_date:due, notes:F.notes.value.trim(), updated_at:new Date().toISOString(), updated_by:meLabel() };
  const ok = await writeTask(async () => {
    if(isNew) must(await sb.from('tasks').insert({...row, position: maxPos() + 1}));
    else must(await sb.from('tasks').update(row).eq('id', editingId));
  });
  if(ok){ if(owner){ ui.lastOwner = owner; try{ localStorage.setItem('ttb.lastOwner', owner); }catch(_){} } closeEditor(); await load(); }
}
async function deleteTask(){
  const b = $('#b-del');
  if(!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent = 'Confirm delete'; return; }
  const ok = await writeTask(async () => { must(await sb.from('tasks').delete().eq('id', editingId)); });
  if(ok){ closeEditor(); await load(); }
}
async function toggleDone(id, checked){
  const status = checked ? 'done' : 'todo';
  const ok = await writeTask(async () => { must(await sb.from('tasks').update({status, updated_at:new Date().toISOString(), updated_by:meLabel()}).eq('id', id)); });
  if(ok) await load(); else render();
}

// ---- data ----
let loading = null, migrated = false;
async function load(){
  if(loading) return loading;
  let again = false;
  loading = (async () => {
    try {
      const rows = must(await sb.from('tasks').select('*').order('start_date', {ascending:true}));
      tasks = rows.map(fromRow); loaded = true; live = true; setSync(); showBanner('');
      if(!migrated && tasks.length && tasks.some(t => t.position == null)){ migrated = true; await renumberAll(); again = true; }
    } catch(e){
      console.error('load failed', e); setSync('err');
      showBanner('Could not load tasks. ' + (e && e.message ? e.message : ''), true);
    }
    render();
  })();
  try { await loading; } finally { loading = null; }
  if(again) return load();
}
let channel = null;
function subscribe(){
  if(channel) return;
  channel = sb.channel('tasks-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'tasks'}, () => { load(); })
    .subscribe();
}
function unsubscribe(){ if(channel){ sb.removeChannel(channel); channel = null; } }

// ---- auth ----
let entered = false;
async function enterBoard(){
  entered = true;
  show('app');
  $('#who').textContent = meLabel();
  render();
  await load();
  subscribe();
}
function leaveBoard(){ entered = false; unsubscribe(); tasks = []; loaded = false; live = false; closeEditor(); show('auth'); $('#l-msg').textContent = ''; $('#l-pass').value = ''; }

$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('#l-msg'); msg.className = 'msg'; msg.textContent = 'Signing in…';
  $('#b-login').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email:$('#l-email').value.trim(), password:$('#l-pass').value });
  $('#b-login').disabled = false;
  if(error){ msg.className = 'msg err'; msg.textContent = /invalid/i.test(error.message) ? 'Wrong email or password.' : error.message; return; }
  msg.textContent = '';
});
$('#b-forgot').addEventListener('click', async () => {
  const email = $('#l-email').value.trim(); const msg = $('#l-msg');
  if(!email){ msg.className='msg err'; msg.textContent = 'Type your email first.'; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  msg.className = error ? 'msg err' : 'msg';
  msg.textContent = error ? error.message : 'If that email is on the team, a reset link is on its way.';
});
$('#b-logout').addEventListener('click', async () => { await sb.auth.signOut(); });
$('#b-pwchange').addEventListener('click', () => { $('#p-msg').textContent=''; $('#p-new').value=''; $('#p-rep').value=''; show('pw'); $('#p-new').focus(); });
$('#b-pw-cancel').addEventListener('click', () => { enterBoard(); });
$('#pw-form').addEventListener('submit', async e => {
  e.preventDefault();
  const a = $('#p-new').value, b = $('#p-rep').value, msg = $('#p-msg');
  if(a.length < 10){ msg.className='msg err'; msg.textContent='At least 10 characters.'; return; }
  if(a !== b){ msg.className='msg err'; msg.textContent='The two passwords differ.'; return; }
  msg.className='msg'; msg.textContent='Saving…';
  const { error } = await sb.auth.updateUser({ password:a });
  if(error){ msg.className='msg err'; msg.textContent=error.message; return; }
  history.replaceState(null, '', location.pathname);
  await enterBoard();
});

// ---- board events ----
$('#b-add').addEventListener('click', () => openEditor(null));
$('#b-save').addEventListener('click', saveTask);
$('#b-cancel').addEventListener('click', closeEditor);
$('#b-del').addEventListener('click', deleteTask);
$('#b-up').addEventListener('click', () => nudge(editingId, -1));
$('#b-down').addEventListener('click', () => nudge(editingId, +1));
ed.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.id!=='b-del' && e.target.id!=='b-cancel'){ e.preventDefault(); saveTask(); } if(e.key==='Escape') closeEditor(); });
$('#hide-done').addEventListener('change', e => { ui.hideDone = e.target.checked; remember('hideDone', ui.hideDone?'1':'0'); render(); });
$('#group-by').addEventListener('change', e => { ui.groupBy = e.target.value; remember('groupBy', ui.groupBy); render(); });
$('#owners-chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if(!c) return;
  ui.owner = c.dataset.owner || ''; remember('owner', ui.owner);
  render();
});
$('#types-chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if(!c) return;
  ui.type = c.dataset.type || ''; remember('type', ui.type);
  render();
});
$('#board').addEventListener('click', e => {
  if(e.target.closest('.drag, .rz')) return;
  const grp = e.target.closest('.row.grp');
  if(grp){
    const gid = grp.dataset.gid;
    ui.collapsed = ui.collapsed.includes(gid) ? ui.collapsed.filter(x => x !== gid) : ui.collapsed.concat([gid]);
    remember('collapsed', ui.collapsed); render(); return;
  }
  const chk = e.target.closest('.chk');
  if(chk){ const row = chk.closest('.row'); toggleDone(row.dataset.id, chk.checked); return; }
  const hit = e.target.closest('.bar, .edge, .row:not(.hdr) .label');
  if(!hit) return;
  const id = hit.dataset.id || hit.closest('.row').dataset.id;
  if(id) openEditor(id);
});

// ---- manual order ----
// Tasks carry a numeric `position`; the board sorts by it (done tasks last). New tasks go to the end.
function currentOrder(){
  // ids of task rows as displayed right now, top to bottom
  return [...document.querySelectorAll('#board .row[data-id]:not(.hdr):not(.grp)')].map(r => r.dataset.id);
}
function posOf(id){ const t = tasks.find(x => x.id === id); return t && typeof t.position === 'number' ? t.position : null; }
function maxPos(){ return tasks.reduce((m, t) => typeof t.position === 'number' && t.position > m ? t.position : m, 0); }
async function writePosition(id, pos){
  const ok = await writeTask(async () => { must(await sb.from('tasks').update({position:pos}).eq('id', id)); });
  if(ok) await load();
}
async function renumberAll(){
  // assign 1,2,3… in the current sort order; used once for tasks that have no position yet, or when gaps run out
  const all = tasks.map(norm);
  const byDate = (a,b)=>{ const ad=a.status==='done', bd=b.status==='done'; if(ad!==bd) return ad?1:-1; return (a.start||'').localeCompare(b.start||'') || (a.due||'').localeCompare(b.due||'') || a.title.localeCompare(b.title); };
  all.sort((a,b)=>{ const ap=a.position, bp=b.position; if(ap!=null&&bp!=null&&ap!==bp) return ap-bp; if(ap!=null&&bp==null) return -1; if(ap==null&&bp!=null) return 1; return byDate(a,b); });
  setSync('saving');
  try { for(let i = 0; i < all.length; i++){ if(all[i].position !== i + 1) must(await sb.from('tasks').update({position:i + 1}).eq('id', all[i].id)); } }
  catch(e){ console.error(e); showBanner('Could not save the task order: ' + ((e && e.message) || '') + '. Run the SQL update from the README, then reload.', true); }
  finally { setSync(); }
}
async function moveTo(id, beforeId, afterId){
  // place `id` between the displayed neighbours; either neighbour may be missing (top or bottom)
  const before = beforeId ? posOf(beforeId) : null, after = afterId ? posOf(afterId) : null;
  let pos;
  if(before == null && after == null) pos = maxPos() + 1;
  else if(before == null) pos = after - 1;
  else if(after == null) pos = before + 1;
  else pos = (before + after) / 2;
  if((before != null && pos <= before) || (after != null && pos >= after)){ await renumberAll(); await load(); return moveTo(id, beforeId, afterId); }
  await writePosition(id, pos);
}
async function nudge(id, dir){
  if(!id) return;
  const order = currentOrder(); const i = order.indexOf(id); if(i < 0) return;
  const j = i + dir; if(j < 0 || j >= order.length) return;
  // moving up: land before order[j]; moving down: land after order[j]
  if(dir < 0) await moveTo(id, order[j-1] || null, order[j]);
  else await moveTo(id, order[j], order[j+1] || null);
}
let dragId = null;
$('#board').addEventListener('dragstart', e => {
  const h = e.target.closest('.drag'); if(!h) return;
  const row = h.closest('.row'); dragId = row.dataset.id; row.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch(_){}
});
$('#board').addEventListener('dragover', e => {
  if(!dragId) return; const row = e.target.closest('.row[data-id]:not(.hdr):not(.grp)'); if(!row || row.dataset.id === dragId) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  const r = row.getBoundingClientRect(); const after = e.clientY > r.top + r.height / 2;
  document.querySelectorAll('#board .drop-before, #board .drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
  row.classList.add(after ? 'drop-after' : 'drop-before');
});
$('#board').addEventListener('dragleave', e => { if(e.target.classList && e.target.classList.contains('row')) e.target.classList.remove('drop-before', 'drop-after'); });
$('#board').addEventListener('drop', async e => {
  if(!dragId) return; e.preventDefault();
  const row = e.target.closest('.row[data-id]:not(.hdr):not(.grp)'); const id = dragId; dragId = null;
  document.querySelectorAll('#board .dragging, #board .drop-before, #board .drop-after').forEach(x => x.classList.remove('dragging', 'drop-before', 'drop-after'));
  if(!row || row.dataset.id === id) return;
  const order = currentOrder().filter(x => x !== id); const k = order.indexOf(row.dataset.id);
  const r = row.getBoundingClientRect(); const after = e.clientY > r.top + r.height / 2;
  const idx = after ? k + 1 : k;
  await moveTo(id, order[idx-1] || null, order[idx] || null);
});
$('#board').addEventListener('dragend', () => { dragId = null; document.querySelectorAll('#board .dragging, #board .drop-before, #board .drop-after').forEach(x => x.classList.remove('dragging', 'drop-before', 'drop-after')); });

// ---- column resize (per person, remembered on this browser) ----
let rz = null;
$('#board').addEventListener('pointerdown', e => {
  const h = e.target.closest('.rz'); if(!h) return;
  e.preventDefault(); e.stopPropagation();
  rz = { col:h.dataset.col, x:e.clientX, w:ui.cols[h.dataset.col] };
  h.setPointerCapture(e.pointerId);
});
$('#board').addEventListener('pointermove', e => {
  if(!rz) return; ui.cols[rz.col] = Math.max(40, Math.round(rz.w + e.clientX - rz.x)); layoutCols();
});
$('#board').addEventListener('pointerup', () => { if(!rz) return; remember('cols', ui.cols); rz = null; render(); });
$('#board').addEventListener('dblclick', e => {
  const h = e.target.closest('.rz'); if(!h) return;
  ui.cols[h.dataset.col] = CFG_COLS[h.dataset.col]; remember('cols', ui.cols); render();
});

// tooltip
const tip = $('#tip');
$('#board').addEventListener('mouseover', e => {
  const bar = e.target.closest('.bar, .edge'); if(!bar) return;
  const t = tasks.map(norm).find(x=>x.id===bar.dataset.id); if(!t) return;
  const n = diff(t.start, t.due) + 1;
  const overdue = t.status!=='done' && t.due < today;
  const when = t.repeat
    ? `${esc(repeatText(t))} · ${short(t.start)} → ${short(t.due)} · ${t.occ.length}×${t.next ? ' · next ' + short(t.next) : ''}`
    : `${short(t.start)} → ${short(t.due)} · ${n} day${n===1?'':'s'}`;
  tip.innerHTML = `<b>${esc(t.title)}</b>${t.objective?'<br>'+esc(t.objective):''}<br>${esc(STATUS[t.status])}${t.type?' · '+esc(t.type):''}${t.owner?' · '+esc(t.owner):''}${overdue?' · <b>overdue '+diff(t.due, today)+'d</b>':''}<br>` +
    `<span class="mono">${when}</span>` +
    (t.notes ? `<br>${esc(t.notes)}` : '');
  tip.hidden = false;
  const r = bar.getBoundingClientRect();
  const w = tip.offsetWidth, hh = tip.offsetHeight;
  let x = Math.min(Math.max(8, e.clientX - w/2), window.innerWidth - w - 8);
  let y = r.top - hh - 8; if(y < 8) y = r.bottom + 8;
  tip.style.left = x+'px'; tip.style.top = y+'px';
});
$('#board').addEventListener('mouseout', e => { if(e.target.closest('.bar, .edge')) tip.hidden = true; });

let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });
setInterval(() => { const t = todayStr(); if(t !== today){ today = t; winStart = addDays(today, -BACK); render(); } }, 60000);
setInterval(() => { if(session && !document.hidden) load(); }, 60000);
document.addEventListener('visibilitychange', () => { if(!document.hidden && session) load(); });

// ---- boot ----
(async function boot(){
  const cfg = window.TTB_CONFIG || {};
  if(!window.supabase || !cfg.url || !cfg.anonKey || /YOUR-PROJECT/.test(cfg.url)){
    show('auth');
    $('#login-form').hidden = true;
    const m = $('#setup-msg'); m.hidden = false;
    m.textContent = !window.supabase ? 'The Supabase library did not load. Check your connection.' : 'Not configured yet: put your Supabase URL and anon key in config.js.';
    return;
  }
  sb = window.supabase.createClient(cfg.url, cfg.anonKey);
  const wantsPassword = /type=(invite|recovery|magiclink)/.test(location.hash);

  const { data } = await sb.auth.getSession();
  session = data.session;
  if(session){ if(wantsPassword) show('pw'); else enterBoard(); }
  else show('auth');

  sb.auth.onAuthStateChange((event, s) => {
    if(event === 'INITIAL_SESSION') return;
    session = s;
    if(event === 'PASSWORD_RECOVERY'){ show('pw'); return; }
    if(event === 'SIGNED_IN' && s && !entered){ if(wantsPassword) show('pw'); else enterBoard(); }
    if(event === 'SIGNED_OUT'){ leaveBoard(); }
  });
})();
})();
